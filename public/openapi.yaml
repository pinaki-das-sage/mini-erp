x-pdf-validation-review:
  scope: Purchasing field names and Oracle data types follow the supplied ME_PUR_VENDOR, ME_PUR_DOC and
    ME_PUR_DOC_ENTRY DDL. Existing API workflow and validation rules remain in effect; entries is the
    nested document API relationship.
  source: Purchasing_PO_API_Through_Vendor_Invoice (1).pdf, version 4.0, 17 November 2026
  field_counts:
    me_pur_vendor: 19
    me_pur_doc: 20
    me_pur_doc_entry: 14
  differences:
    - completed has no transition in the PDF. submitted applies to Requisitions, which the current
      recordtype examples do not represent.
    - Entry notes and its 500-character limit are a merged-contract extension; PDF Notes is at document
      level.
    - Vendor and purchase document POST requests omit generated identity and audit fields. Document POST
      examples omit calculated or inapplicable fields instead of submitting null. GET examples remain
      full records. These are contract expectations; live backend parity is not verified here.
    - The PDF does not prescribe internal-key, timestamp-format, calculated-value mismatch messages or
      HTTP status codes. Those messages are marked merged-contract; 400/403/404/409/503 are contract
      status mappings.
    - Documents use order/order_id, receiver/receiver_id and invoice/invoice_id. Only the selected type
      key is supplied. Entries use cnyid/id; identity and audit fields are generated.
  workflow_rules:
    - Document POST creates the header and entries together. Document PATCH accepts payment_terms, status
      and entries. An existing entry ID permits description/notes updates; an entry without ID adds a new
      line.
    - Standalone document-entry endpoints support GET only. Parent links and generated identity/audit
      fields cannot be changed through client input.
    - Entry IDs and line numbers are unique within their scopes. Each entry belongs to the company and
      document returned by GET. Invalid nested changes leave the header and all entries unchanged.
    - Invoice amountdue equals its line total. Invoice due date is calculated from its date and payment
      terms; a supplied due date must agree. POST and GET both use vendor_id.
    - Calculated line amounts are rounded half-up to 2 decimals before summing total. Reject excess input
      precision and overflow; no partial saved records or effects on failure.
