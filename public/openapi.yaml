  /logistics/vehicles/{id}/update:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags:
        - Logistics - Vehicles
      summary: Update a vehicle
      description: >
        An assigned Vehicle cannot be deactivated or have its capacity changed.
        DRAFT and DISPATCHED Trips are active assignments. A rejected
        deactivation leaves the Vehicle and all submitted fields unchanged.
        Vehicles with only DELIVERED or CANCELLED Trip history may be
        deactivated. The update returns HTTP 409 while an active assignment
        prevents the requested change.
      operationId: updateVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Command'
                - type: object
                  properties:
                    vehicle_code:
                      type: integer
                      minimum: 1
                    registration_number:
                      type: string
                      maxLength: 40
                    capacity:
                      $ref: '#/components/schemas/PositiveKilograms'
                    description:
                      type: [ string, 'null' ]
                      maxLength: 255
                    is_active:
                      type: string
                      enum: [ 'T', 'F' ]
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
