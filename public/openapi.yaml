openapi: 3.1.0

info:
  title: Mini ERP API
  description: >
    OpenAPI contract for the Mini ERP Sales and Logistics modules. This document describes
    API routes and payloads. It does not implement the backend. Confirm the
    deployed application base URL, credentials, and permission names with the team.
  version: 1.0.0

servers:
  - url: ./api/v1
    description: Versioned API base URL

tags:
  - name: Authentication
  - name: "Sales - Customers"
  - name: "Sales - Sales Quotes"
  - name: "Sales - Sales Orders"
  - name: "Sales - Sales Invoices"
  - name: "Sales - Customer Payments"
  - name: "Logistics - Vehicles"
  - name: "Logistics - Drivers"
  - name: "Logistics - Trips"
  - name: Metadata
  - name: Logistics - Trip Lines
    description: Read saved trip lines, related trip/Sales/product data and current stock balances.

x-tagGroups:
  - name: Common
    tags: [ Authentication, Metadata ]
  - name: Sales
    tags:
      - "Sales - Customers"
      - "Sales - Sales Quotes"
      - "Sales - Sales Orders"
      - "Sales - Sales Invoices"
      - "Sales - Customer Payments"
  - name: Logistics
    tags:
      - "Logistics - Vehicles"
      - "Logistics - Drivers"
      - "Logistics - Trips"
      - Logistics - Trip Lines

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [ Authentication ]
      summary: Login to Mini ERP
      description: Authenticate a user and generate an access token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ company, username, password ]
              properties:
                company:
                  type: string
                  example: SIA-MINI-ERP
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: admin
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /auth/me:
    get:
      tags: [ Authentication ]
      summary: Get the current user
      description: Verify the bearer token and return the caller's identity, roles and permissions.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /meta/permissions:
    get:
      tags: [ Metadata ]
      summary: List registered permissions
      operationId: getPermissions
      responses:
        '200':
          description: Registered permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /meta/enums:
    get:
      tags: [ Metadata ]
      summary: Get API enumeration values
      operationId: getEnums
      responses:
        '200':
          description: Enumeration values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /meta/contract:
    get:
      tags: [ Metadata ]
      summary: Get API contract metadata
      operationId: getContract
      responses:
        '200':
          description: API contract metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /logistics/vehicles:
    post:
      tags:
        - Logistics - Vehicles
      summary: Create a vehicle
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Command'
                - type: object
                  required: [ vehicle_code, registration_number, capacity ]
                  properties:
                    vehicle_code:
                      type: integer
                      minimum: 1
                      example: 307
                    registration_number:
                      type: string
                      maxLength: 40
                      example: KA01AB1234
                    capacity:
                      $ref: '#/components/schemas/PositiveKilograms'
                    description:
                      type: [ string, 'null' ]
                      maxLength: 255
                    is_active:
                      type: string
                      default: "T"
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags:
        - Logistics - Vehicles
      summary: List vehicles
      operationId: listVehicles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged vehicle list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags:
        - Logistics - Vehicles
      summary: Get a vehicle
      operationId: getVehicle
      responses:
        '200':
          description: Vehicle details and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /logistics/drivers:
    post:
      tags: [ "Logistics - Drivers" ]
      summary: Create a driver profile
      operationId: createDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [ driver_code, first_name, last_name, licence_number, licence_expiry ]
                  properties:
                    driver_code:
                      type: string
                      maxLength: 30
                    user_id:
                      type: [ integer, 'null' ]
                      minimum: 1
                    first_name:
                      type: string
                      maxLength: 100
                    last_name:
                      type: string
                      maxLength: 100
                    phone:
                      type: [ string, 'null' ]
                      maxLength: 30
                    licence_number:
                      type: string
                      maxLength: 50
                    licence_expiry:
                      type: string
                      format: date
                    isactive:
                      type: string
                      enum: [ 'T', 'F' ]
                      default: 'T'
      responses:
        '201':
          description: Driver created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: ["Logistics - Drivers"]
      summary: List drivers
      operationId: listDrivers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged driver list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/drivers/eligible:
    get:
      tags: ["Logistics - Drivers"]
      summary: List Drivers eligible for Trip assignment
      description: >
        Returns active same-company Drivers with a valid active linked Foundation
        account (when linked), no other active Draft/Dispatched Trip assignment,
        and a licence expiry on or after the business date represented by
        planned_departure_at. Licence eligibility is evaluated for the requested
        departure date, not the current date.
      operationId: listEligibleDrivers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: planned_departure_at
          in: query
          required: true
          description: ISO-8601 departure timestamp including its UTC offset.
          schema:
            type: string
            format: date-time
          example: '2026-11-30T09:00:00+05:30'
        - name: exclude_trip_id
          in: query
          required: false
          description: Exclude this Draft Trip when checking resource availability during edit.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Eligible Drivers for the planned departure date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/drivers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: ["Logistics - Drivers"]
      summary: Get a driver
      operationId: getDriver
      responses:
        '200':
          description: Driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /logistics/drivers/{id}/update:
    post:
      tags: ["Logistics - Drivers"]
      summary: Update a driver profile
      operationId: updateDriver
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ driver_code, first_name, last_name, licence_number, licence_expiry ]
              properties:
                driver_code:
                  type: string
                  maxLength: 30
                user_id:
                  type: [ integer, 'null' ]
                  minimum: 1
                first_name:
                  type: string
                  maxLength: 100
                last_name:
                  type: string
                  maxLength: 100
                phone:
                  type: [ string, 'null' ]
                  maxLength: 30
                licence_number:
                  type: string
                  maxLength: 50
                licence_expiry:
                  type: string
                  format: date
                isactive:
                  type: string
                  enum: [ 'T', 'F' ]
      responses:
        '200':
          description: Driver updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /logistics/drivers/{id}/delete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: ["Logistics - Drivers"]
      summary: Delete or deactivate a driver profile
      description: >
        A driver never referenced by a Trip may be deleted. A driver with historical Trip references is deactivated. A driver assigned to an active Trip cannot be deleted or deactivated.
      operationId: deleteDriver
      requestBody:
        required: true
        description: The API requires a JSON content type on writes; send an empty object.
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: Empty object returned after the driver is deleted or deactivated
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/driver-users:
    get:
      tags: ["Logistics - Drivers"]
      summary: List Foundation users eligible to link to a Driver profile
      description: >
        Returns active Foundation users in the authenticated company who are not
        already linked to another active Driver profile. The numeric ME_USERS.ID
        is returned as the Driver USER_ID foreign key; the Foundation USER_ID is
        exposed only as identity/display/search information. This lookup is
        separate from eligible Drivers used for Trip assignment. The company is
        derived from the authenticated actor.
      operationId: listEligibleDriverUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          description: Match Foundation USER_ID, username, or display name.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Eligible driver user accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverUserListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/sales-orders/eligible:
    get:
      tags: ["Logistics - Trips"]
      summary: List eligible Sales Orders for whole-Order Trip assignment
      description: >
        Returns same-company Submitted Sales Orders with saved lines and no
        current Trip assignment. Each eligible Order can be assigned to exactly
        one Trip containing every saved Order line.
      operationId: listEligibleTripSalesOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Eligible Sales Orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibleTripSalesOrderListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/trips:
    post:
      tags: ["Logistics - Trips"]
      summary: Create a Draft Trip for one complete Sales Order
      description: >
        One complete Submitted Sales Order is assigned to one Trip. Every saved
        Order line is included automatically; partial mappings and a second
        active Trip for the Order are rejected. Every line shares that Trip's
        reference and status. Product identity, quantity,
        line weight and Sales Order identity come from locked server-side data.
        The complete Order load is checked against Vehicle capacity. Draft
        assignment keeps the Order Submitted; dispatching the complete Trip
        moves it to In Progress, and delivering the complete Trip closes it.
        Draft cancellation clears the complete assignment. Invoice creation is
        a separate Sales action. The selected Driver's licence must be valid
        on the planned departure date. Logistics locks the Sales Order before
        Vehicle/Driver resources and creates all TripLines in the same outer
        transaction as the Sales callback.
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_number, trip_code, vehicle_id, driver_id, planned_departure_at]
              properties:
                order_number:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,20}$'
                  example: SO-000000000000022
                trip_code:
                  type: integer
                  minimum: 1
                  example: 1001
                vehicle_id:
                  type: integer
                  minimum: 1
                driver_id:
                  type: integer
                  minimum: 1
                planned_departure_at:
                  type: string
                  format: date-time
                  example: '2026-11-26T10:00:00+05:30'
              example:
                order_number: SO-000000000000022
                trip_code: 1001
                vehicle_id: 1
                driver_id: 63
                planned_departure_at: '2026-11-26T10:00:00+05:30'
      responses:
        '201':
          description: Draft trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: ["Logistics - Trips"]
      summary: List trips
      operationId: listTrips
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: ["Logistics - Trips"]
      summary: Get a trip
      operationId: getTrip
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /logistics/trips/{id}/update:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: ["Logistics - Trips"]
      summary: Update a Draft trip's Vehicle, Driver and planned departure
      description: >
        Updates Trip resources only. Logistics locks the Trip, then its Sales
        Order, before locking Vehicle/Driver resources. The complete Sales
        Order assignment remains on this Trip. The selected Driver's licence
        must be valid on the resulting planned departure date. The changes
        commit or roll back together in the Logistics transaction.
      operationId: updateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ vehicle_id, driver_id, planned_departure_at ]
              properties:
                vehicle_id:
                  type: integer
                  minimum: 1
                driver_id:
                  type: integer
                  minimum: 1
                planned_departure_at:
                  type: string
                  format: date-time
                  example: '2026-11-26T11:00:00+05:30'
      responses:
        '200':
          description: Draft trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: ["Logistics - Trips"]
      summary: Cancel a Draft trip
      description: >
        Cancels the complete Draft Trip and clears the complete Sales Order
        assignment. Dispatched or Delivered Trips cannot be cancelled. A
        required cancellation reason is saved; Trip and TripLine history remain.
        The Sales Order remains or returns to Submitted, and Inventory On Hand
        is unchanged. Logistics locks the Trip and all TripLines before the
        Sales Order, then records cancellation and its complete line mapping in
        the shared outer transaction. A committed retry verifies the saved
        cancellation read-only and does not invoke the callback again.
      operationId: cancelTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ reason ]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: Vehicle unavailable
      responses:
        '200':
          description: Complete Draft Trip cancelled and Vehicle/Driver released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/dispatch:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: ["Logistics - Trips"]
      summary: Dispatch the complete Draft Trip
      description: >
        Draft -> Dispatched for the complete Trip and every saved Order line.
        Logistics locks the Trip and all TripLines, then the Sales Order,
        before revalidating Vehicle/Driver eligibility and consuming every
        Inventory reservation. The complete mapping is sent to Sales in the
        shared outer transaction; all Logistics, Inventory and Sales writes
        commit or roll back together. The Sales Order moves from Submitted to
        In Progress. A committed retry verifies the complete saved Trip mapping
        and consumed reservations read-only; it does not consume Inventory
        again or invoke the Sales callback again.
      operationId: dispatchTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
              example: {}
      responses:
        '200':
          description: Trip dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /logistics/trips/{id}/deliver:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: ["Logistics - Trips"]
      summary: Complete delivery of a Dispatched trip
      description: >
        Dispatched -> Delivered for the complete Trip and every saved Order
        line. Logistics locks the Trip and all TripLines, then the Sales Order,
        and sends the complete mapping to recordDelivery() in the shared outer
        transaction. Sales closes the Order. Only the assigned Driver may
        record delivery. Delivery does not create or modify an Invoice; Invoice
        creation remains a separate Sales action. A committed retry verifies
        saved state read-only and does not invoke the Sales callback again.
      operationId: deliverTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
              example: {}
      responses:
        '200':
          description: Trip delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /sales/customers:
    post:
      tags: [ "Sales - Customers" ]
      summary: Create a Customer
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerCreateRequest" }
            example:
              customer_name: Example Traders
              billing_address_line_1: 12 Market Road
              city: Bengaluru
              country: India
      responses: { "201": { $ref: "#/components/responses/Customer" }, default: { $ref: "#/components/responses/CustomerQuoteError" } }
    get:
      tags: [ "Sales - Customers" ]
      summary: List Customers
      operationId: listCustomers
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/CustomerActive" }
        - { $ref: "#/components/parameters/SalesPage" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { $ref: "#/components/responses/CustomerList" }
        default: { $ref: "#/components/responses/CustomerQuoteError" }

  /sales/customers/{id}:
    parameters:
      - { $ref: "#/components/parameters/CustomerRecordIdPath" }
    get:
      tags: [ "Sales - Customers" ]
      summary: Get a Customer
      operationId: getCustomer
      responses: { "200": { $ref: "#/components/responses/Customer" }, default: { $ref: "#/components/responses/CustomerQuoteError" } }

  /sales/customers/{id}/update:
    parameters:
      - { $ref: "#/components/parameters/CustomerRecordIdPath" }
    post:
      tags: [ "Sales - Customers" ]
      summary: Update or activate/deactivate a Customer using POST
      operationId: updateCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerUpdateRequest" }
            example:
              is_active: "F"
              billing_address_line_1: BTM Layout 2nd Stage
      responses: { "200": { $ref: "#/components/responses/Customer" }, default: { $ref: "#/components/responses/CustomerQuoteError" } }

  /sales/quotes:
    post:
      tags: [ "Sales - Sales Quotes" ]
      summary: Create a Draft Quote
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuoteCreateRequest" }
            example:
              customer_code: CUST-0023
              warehouse_id: W01
              quote_date: "2026-11-24"
              valid_until: "2026-11-24"
