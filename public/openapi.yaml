        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste only result.access_token from login. Swagger adds the Bearer prefix.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    SalesPage: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
    CustomerCode: { name: customer_code, in: query, schema: { $ref: "#/components/schemas/CustomerCode" } }
    WarehouseId: { name: warehouse_id, in: query, schema: { type: string, minLength: 1, maxLength: 20 } }
    DocumentStatus:
      name: status
      in: query
      schema: { type: string, enum: [ Draft, Submitted, In Progress, Closed ] }
    FromDate: { name: from_date, in: query, schema: { type: string, format: date } }
    ToDate: { name: to_date, in: query, schema: { type: string, format: date } }
    InvoiceNumber:
      name: invoice_number
      in: path
      required: true
      description: Saved Invoice Number returned by create/list/get Invoice, for example SI-000000000000003.
        Enter your actual Invoice Number here; it is part of the URL, not a request-body field.
      schema: { $ref: "#/components/schemas/SalesDocumentNumber" }
    DraftSubmittedStatus: { name: status, in: query, schema: { type: string, enum: [ Draft, Submitted ] } }
    Search:
      {
        name: search,
        in: query,
        description: Search Customer Code or Customer Name.,
        schema: { type: string, maxLength: 100 }
      }
    CustomerActive:
      name: is_active
      in: query
      description: T for active Customers or F for inactive Customers. Omit for both; use T for new selections.
      schema: { $ref: "#/components/schemas/CustomerDetails/properties/is_active" }
    PaymentStatus:
      name: payment_status
      in: query
      schema: { type: string, enum: [ Unpaid, Partially Paid, Paid ] }
    DocumentType: { name: type, in: query, schema: { type: string, enum: [ Quote, Order, Invoice ] } }
    CustomerRecordIdPath:
      name: id
      in: path
      required: true
      description: Generated numeric Customer record ID. Lookup is scoped to the signed-in company.
      schema: { $ref: "#/components/schemas/CustomerRecordId" }
      example: 1
    QuoteNumber:
      name: quote_number
      in: path
      required: true
      description: Quote DOCUMENT_NUMBER in ME_OE_DOCUMENTS, not the internal record ID.
      schema: { $ref: "#/components/schemas/SalesDocumentNumber" }
    OrderNumber:
      name: order_number
      in: path
      required: true
      schema: { $ref: "#/components/schemas/SalesDocumentNumber" }

  requestBodies:
    InvoiceAction:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/InvoiceActionRequest" }
          example: { expected_version: 2 }
    SalesDocumentAction:
      required: true
      content: { application/json: { schema: { $ref: "#/components/schemas/SalesDocumentActionRequest" } } }

  schemas:
    Command:
      type: object
      required: [ action_reference ]
      properties:
        action_reference:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9_-]+$'
          example: action-001

    VersionedCommand:
      allOf:
        - $ref: '#/components/schemas/Command'
        - type: object
          required: [ expected_version ]
          properties:
            expected_version:
              type: integer
              minimum: 1
              example: 1

    Kilograms:
      type: string
      description: Decimal kilogram value represented as a string.
      pattern: '^[0-9]+(\.[0-9]{1,3})?$'
      example: '30.000'

    PositiveKilograms:
      type: string
      description: Positive decimal kilogram value with at most nine integer digits and three fractional digits.
      pattern: '^(?=.*[1-9])[0-9]{1,9}(\.[0-9]{1,3})?$'
      example: '30.000'

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        operation_id:
          type: [ string, 'null' ]
        current_version:
          type: [ integer, 'null' ]
        result:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 3600
            expires_at:
              type: string
              format: date-time
            must_change_password:
              type: boolean
        error:
          type: [ object, 'null' ]

    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        operation_id:
          type: [ string, 'null' ]
        current_version:
          type: [ integer, 'null' ]
        result: {}
        error:
          type: [ object, 'null' ]

    VehicleCapacity:
      type: string
      pattern: '^(?=.*[1-9])[0-9]{1,9}(?:\.[0-9]{1,3})?$'
      example: '30.000'

    Vehicle:
      type: object
      required: [id, vehicle_code, registration_number, capacity, is_active]
      properties:
        id:
          type: integer
          minimum: 1
        vehicle_code:
          type: integer
          minimum: 1
        registration_number:
          type: string
          maxLength: 40
        description:
          type: [ string, 'null' ]
          maxLength: 255
        capacity:
          type: number
          minimum: 0.001
          maximum: 999999999.999
          multipleOf: 0.001
          description: Capacity in kilograms; returned from the Vehicle service as a JSON number.
        is_active:
          type: string
          enum: ['T', 'F']
        assignment_status:
          type: string
          enum: [AVAILABLE, ASSIGNED]

    Driver:
      type: object
