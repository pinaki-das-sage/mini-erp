    OrderTripFields:
      x-database-field-mapping:
        trip_reference: TRIP_ID translated through the Logistics provider identifier
        trip_status: TRIP_STATUS
        trip_assigned: Derived from the current valid Trip assignment
      x-database-internal-fields:
        - LOGISTICS_TRIP_LINE_ID
      type: object
      required: [ trip_reference, trip_assigned, trip_status ]
      properties:
        trip_reference:
          type: [ string, "null" ]
          readOnly: true
          description: Public reference to the single current Logistics Trip assigned to the complete Order. Every saved line has the same current reference and status. Cleared for every line when the Draft Trip is cancelled.
        trip_status:
          type: [ string, "null" ]
          enum: [ Draft, Dispatched, Delivered, Cancelled, null ]
          readOnly: true
          description: >
            Draft, Dispatched or Delivered when this line is currently assigned;
            null or Cancelled when it has no current assignment.
        trip_assigned:
          type: boolean
          readOnly: true
          description: True only when this line has a current Trip reference and active Trip status.
      if: { required: [ trip_assigned ], properties: { trip_assigned: { const: true } } }
      then:
        properties:
          trip_reference: { type: string, minLength: 1 }
          trip_status: { enum: [ Draft, Dispatched, Delivered ] }
      else: { properties: { trip_reference: { type: "null" }, trip_status: { enum: [ Cancelled, null ] } } }
