openapi: 3.1.0

info:
  title: Mini ERP API
  description: Mini ERP REST API documentation
  version: 1.0.0

servers:
  - url: ./api/v1

paths:

  /auth/login:
    post:
      tags:
        - Authentication

      summary: Login to Mini ERP

      description: Authenticate user and generate access token.

      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - company
                - username
                - password
              properties:
                company:
                  type: string
                  example: SIA-MINI-ERP

                username:
                  type: string
                  example: admin

                password:
                  type: string
                  format: password
                  example: secret123

      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  result:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: abc123xyz

        '401':
          description: Invalid credentials

        '500':
          description: Internal server error