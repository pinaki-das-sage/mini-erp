openapi: 3.1.0

info:
  title: Mini ERP Logistics API
  description: >
    OpenAPI contract for the Mini ERP Logistics module. This document describes
    API routes and payloads. It does not implement the backend. Confirm the
    deployed application base URL, credentials, and permission names with the team.
  version: 1.0.0

servers:
  - url: ./api/v1
    description: Versioned API base URL

tags:
  - name: Authentication
  - name: Vehicles
  - name: Drivers
  - name: Resources
  - name: Orders
  - name: Trips
  - name: Dispatch and Delivery
  - name: History and Reconciliation
  - name: Metadata

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login to Mini ERP
      description: Authenticate a user and generate an access token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, username, password]
              properties:
                company:
                  type: string
                  example: SIA-MINI-ERP
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: admin
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      description: Verify the bearer token and return the caller's identity, roles and permissions.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /meta/permissions:
    get:
      tags: [Metadata]
      summary: List registered permissions
      operationId: getPermissions
      responses:
        '200':
          description: Registered permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /meta/enums:
    get:
      tags: [Metadata]
      summary: Get API enumeration values
      operationId: getEnums
      responses:
        '200':
          description: Enumeration values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /meta/contract:
    get:
      tags: [Metadata]
      summary: Get API contract metadata
      operationId: getContract
      responses:
        '200':
          description: API contract metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /logistics/vehicles:
    post:
      tags: [Vehicles]
      summary: Create a vehicle
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Command'
                - type: object
                  required: [vehicle_code, registration_number, capacity]
                  properties:
                    vehicle_code:
                      type: integer
                      minimum: 1
                      example: 307
                    registration_number:
                      type: string
                      maxLength: 40
                      example: KA01AB1234
                    capacity:
                      $ref: '#/components/schemas/PositiveKilograms'
                    description:
                      type: [string, 'null']
                      maxLength: 255
                    is_active:
                      type: string
                      default: "T"
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Vehicles]
      summary: List vehicles
      operationId: listVehicles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: active
          in: query
          schema:
            type: boolean
        - name: assignment_status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, ASSIGNED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged vehicle list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Vehicles]
      summary: Get a vehicle
      operationId: getVehicle
      responses:
        '200':
          description: Vehicle details and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
  /logistics/vehicles/{id}/update:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Vehicles]
      summary: Update a vehicle
      operationId: updateVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Command'
                - type: object
                  properties:
                    vehicle_code:
                      type: integer
                      minimum: 1
                    registration_number:
                      type: string
                      maxLength: 40
                    capacity:
                      $ref: '#/components/schemas/PositiveKilograms'
                    description:
                      type: [string, 'null']
                      maxLength: 255
                    is_active:
                      type: string
                      enum: ['T', 'F']
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /logistics/vehicles/{id}/delete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Vehicles]
      summary: Delete a never-used vehicle
      operationId: deleteVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: Vehicle deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/drivers:
    post:
      tags: [Drivers]
      summary: Create a driver profile
      operationId: createDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [driver_code, first_name, last_name, licence_number, licence_expiry]
                  properties:
                    driver_code:
                      type: string
                      maxLength: 30
                    user_id:
                      type: [integer, 'null']
                      minimum: 1
                    first_name:
                      type: string
                      maxLength: 100
                    last_name:
                      type: string
                      maxLength: 100
                    phone:
                      type: [string, 'null']
                      maxLength: 30
                    licence_number:
                      type: string
                      maxLength: 50
                    licence_expiry:
                      type: string
                      format: date
                    isactive:
                      type: string
                      enum: ['T', 'F']
                      default: 'T'
      responses:
        '201':
          description: Driver created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Drivers]
      summary: List drivers
      operationId: listDrivers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged driver list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/drivers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Drivers]
      summary: Get a driver
      operationId: getDriver
      responses:
        '200':
          description: Driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Drivers]
      summary: Update a driver profile
      operationId: updateDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [driver_code, first_name, last_name, licence_number, licence_expiry]
                  properties:
                    driver_code:
                      type: string
                      maxLength: 30
                    user_id:
                      type: [integer, 'null']
                      minimum: 1
                    first_name:
                      type: string
                      maxLength: 100
                    last_name:
                      type: string
                      maxLength: 100
                    phone:
                      type: [string, 'null']
                      maxLength: 30
                    licence_number:
                      type: string
                      maxLength: 50
                    licence_expiry:
                      type: string
                      format: date
                    isactive:
                      type: string
                      enum: ['T', 'F']
      responses:
        '200':
          description: Driver updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /logistics/drivers/{id}/delete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Drivers]
      summary: Delete or deactivate a driver profile
      description: >
        A driver never referenced by a Trip may be deleted. A driver with
        historical Trip references is deactivated. A driver assigned to an
        active Trip cannot be deleted or deactivated.
      operationId: deleteDriver
      requestBody:
        required: true
        description: The API requires a JSON content type on writes; send an empty object.
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: Empty object returned after the driver is deleted or deactivated
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/driver-users:
    get:
      tags: [Drivers]
      summary: List eligible same-company driver user accounts
      operationId: listEligibleDriverUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Eligible driver user accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/resources/availability:
    get:
      tags: [Resources]
      summary: Check vehicle or driver availability
      operationId: getResourceAvailability
      parameters:
        - name: resource_type
          in: query
          required: true
          schema:
            type: string
            enum: [vehicle, driver]
        - name: planned_departure_at
          in: query
          required: true
          description: Timestamp including UTC offset.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Availability and eligibility results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/dispatchable-orders:
    get:
      tags: [Orders]
      summary: List eligible Sales Order lines available for trip planning
      operationId: listDispatchableOrders
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: customer_id
          in: query
          schema:
            type: string
        - name: order_reference
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Eligible Sales Order lines grouped by order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchableLinesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/trip-lines:
    get:
      tags: [Trips]
      summary: List company trip planning lines
      operationId: listPlanningTripLines
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: trip_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Shared envelope with result.items, page and page_size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Trips]
      summary: Create an unpublished Draft planning line
      description: >
        Reads the complete Sales source quantity and Inventory product weight.
        Does not post Sales assignment fields or change Inventory or trip status.
        Published Sales assignments must use the team's coordinated workflow.
      operationId: createPlanningTripLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningTripLineCreate'
      responses:
        '201':
          description: Trip line created in the shared response envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningTripLineEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trip-lines/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Trips]
      summary: Get a company trip planning line
      operationId: getPlanningTripLine
      responses:
        '200':
          description: Trip line details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningTripLineEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /logistics/trip-lines/{id}/update:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Update or refresh an unpublished Draft planning line
      operationId: updatePlanningTripLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningTripLineUpdate'
      responses:
        '200':
          description: Trip line updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningTripLineEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trip-lines/{id}/delete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Delete an unpublished Draft planning line
      operationId: deletePlanningTripLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: Shared envelope with result.id and result.deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips:
    post:
      tags: [Trips]
      summary: Create an empty Draft trip and reserve its Vehicle and Driver pair
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Command'
                - type: object
                  required: [trip_reference, vehicle_id, driver_id, planned_departure_at]
                  properties:
                    trip_reference:
                      type: integer
                      minimum: 1
                      example: 1001
                    vehicle_id:
                      type: integer
                      minimum: 1
                    driver_id:
                      type: integer
                      minimum: 1
                    planned_departure_at:
                      type: string
                      format: date-time
      responses:
        '201':
          description: Draft trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Trips]
      summary: List trips
      operationId: listTrips
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, DISPATCHED, DELIVERED, CANCELLED]
        - name: trip_reference
          in: query
          schema:
            type: integer
            minimum: 1
        - name: assigned_to_me
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paged trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Trips]
      summary: Get trip details, assigned Sales lines and derived weight totals
      operationId: getTrip
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetailEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Trips]
      summary: Edit a Draft trip or replace its resources
      operationId: updateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionedCommand'
                - type: object
                  properties:
                    vehicle_id:
                      type: integer
                      minimum: 1
                    driver_id:
                      type: integer
                      minimum: 1
                    planned_departure_at:
                      type: string
                      format: date-time
      responses:
        '200':
          description: Draft trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/lines:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Assign one complete Sales Order line to a Draft trip
      description: >
        A Trip may reference only one SUBMITTED Sales Order. Assign complete
        allocated source lines, never partial quantities. The same Sales line
        cannot be assigned to another non-cancelled Trip.
      operationId: addTripLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionedCommand'
                - type: object
                  required: [sales_order_id, sales_line_id, expected_sales_order_version]
                  properties:
                    sales_order_id:
                      type: string
                    sales_line_id:
                      type: string
                    expected_sales_order_version:
                      type: integer
                      minimum: 1
      responses:
        '200':
          description: Complete Sales Order line assigned to the Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLineEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/lines/{sales_line_id}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: sales_line_id
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Trips]
      summary: Remove a complete Sales Order line from a Draft trip
      description: Removes the whole source line only; it does not split quantity or change Sales or Inventory data.
      operationId: removeTripLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommand'
      responses:
        '200':
          description: TripLine removed from the Draft Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Cancel a Draft trip
      operationId: cancelTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionedCommand'
                - type: object
                  required: [reason]
                  properties:
                    reason:
                      type: string
                      minLength: 1
                      maxLength: 500
      responses:
        '200':
          description: Trip cancelled and resources released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/dispatch:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Dispatch and Delivery]
      summary: Dispatch all assigned TripLines atomically
      description: >
        Dispatch is allowed only after every Sales Order line has been assigned
        across its planned Draft Trips. The first dispatch advances Sales to
        IN_PROGRESS.
      operationId: dispatchTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommand'
      responses:
        '200':
          description: Trip dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDispatchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /logistics/trips/{id}/manifest:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Dispatch and Delivery]
      summary: Read the derived dispatch summary
      description: Read-only projection from Trip, TripLine, Vehicle, Driver, Product and Sales Order data.
      operationId: getTripManifest
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Derived dispatch summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDispatchEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/deliveries:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Dispatch and Delivery]
      summary: Record full successful delivery on a TripLine
      description: >
        Only the authenticated assigned driver may record delivery. Partial,
        excess, fractional and duplicate delivery are rejected.
      operationId: recordDelivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionedCommand'
                - type: object
                  required: [trip_line_id, delivered_quantity]
                  properties:
                    trip_line_id:
                      type: integer
                      minimum: 1
                    delivered_quantity:
                      type: integer
                      minimum: 1
      responses:
        '200':
          description: TripLine delivery fields updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLineEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Dispatch and Delivery]
      summary: Read delivery fields from TripLines
      operationId: listDeliveries
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: TripLines with optional full-delivery fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripLinesEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/trips/{id}/close:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Close a fully delivered and reconciled Trip
      description: >
        Validates every TripLine delivery and the Sales in-transit balance,
        marks the Trip DELIVERED and releases the current Vehicle and Driver.
      operationId: closeTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommand'
      responses:
        '200':
          description: Trip marked DELIVERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/history:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [History and Reconciliation]
      summary: Read sanitized trip history
      operationId: getTripHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Append-only trip event history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'

  /logistics/reconciliation:
    get:
      tags: [History and Reconciliation]
      summary: Read logistics reconciliation
      operationId: getReconciliation
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: trip_id
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Read-only reconciliation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    PlanningTripLineCreate:
      allOf:
        - $ref: '#/components/schemas/Command'
        - type: object
          required: [trip_id, sales_line_id]
          properties:
            trip_id:
              type: integer
              minimum: 1
              example: 23
            sales_line_id:
              type: integer
              minimum: 1
              example: 83
              description: ME_OE_DOCUMENT_LINES.RECORD#; product and quantity are read from this row. Its DOCUMENT_RECORD# must match the trip's SALES_ORDER_ID.
      unevaluatedProperties: false

    PlanningTripLineUpdate:
      allOf:
        - $ref: '#/components/schemas/Command'
        - type: object
          anyOf:
            - required: [sales_line_id]
            - required: [product_id]
            - required: [quantity]
          properties:
            sales_line_id:
              type: integer
              minimum: 1
            product_id:
              type: integer
              minimum: 1
            quantity:
              type: integer
              minimum: 1
      unevaluatedProperties: false

    PlanningTripLine:
      type: object
      required: [id, trip_id, sales_line_id, product_id, quantity, total_weight, line_load]
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        sales_line_id:
          type: string
        product_id:
          type: string
        quantity:
          type: string
        total_weight:
          type: string
          description: Full line weight in KG derived from Inventory unit grams and Sales quantity.
        line_load:
          type: string
          description: Same full line KG weight, used for vehicle capacity checks.

    PlanningTripLineEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/PlanningTripLine'

    Command:
      type: object
      required: [action_reference]
      properties:
        action_reference:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9_-]+$'
          example: action-001

    VersionedCommand:
      allOf:
        - $ref: '#/components/schemas/Command'
        - type: object
          required: [expected_version]
          properties:
            expected_version:
              type: integer
              minimum: 1
              example: 1

    Kilograms:
      type: string
      description: Decimal kilogram value represented as a string.
      pattern: '^[0-9]+(\.[0-9]{1,3})?$'
      example: '30.000'

    PositiveKilograms:
      type: string
      description: Positive decimal kilogram value with at most three fractional digits.
      pattern: '^(?=.*[1-9])[0-9]+(\.[0-9]{1,3})?$'
      example: '30.000'

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 3600
            expires_at:
              type: string
              format: date-time
            must_change_password:
              type: boolean
        error:
          type: [object, 'null']

    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result: {}
        error:
          type: [object, 'null']

    Vehicle:
      type: object
      required: [id, vehicle_code, registration_number, capacity_kg, active, assignment_status, current_version]
      properties:
        id:
          type: integer
          minimum: 1
        vehicle_code:
          type: integer
          minimum: 1
        registration_number:
          type: string
          maxLength: 40
        description:
          type: [string, 'null']
          maxLength: 255
        capacity_kg:
          $ref: '#/components/schemas/PositiveKilograms'
        active:
          type: boolean
        assignment_status:
          type: string
          enum: [AVAILABLE, ASSIGNED]
        active_trip_id:
          type: [integer, 'null']
        current_version:
          type: integer
          minimum: 1

    Driver:
      type: object
      required: [id, driver_code, first_name, last_name, licence_number, licence_expiry, isactive]
      properties:
        id:
          type: integer
          minimum: 1
        driver_code:
          type: string
          maxLength: 30
        user_id:
          type: [integer, 'null']
          minimum: 1
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: [string, 'null']
          maxLength: 30
        licence_number:
          type: string
          maxLength: 50
        licence_expiry:
          type: string
          format: date
        isactive:
          type: string
          enum: ['T', 'F']

    Trip:
      type: object
      required: [id, trip_reference, vehicle_id, driver_id, planned_departure_at, status, sales_order_id, planned_load_kg, capacity_kg, remaining_capacity_kg, current_version]
      properties:
        id:
          type: integer
          minimum: 1
        trip_reference:
          type: integer
          minimum: 1
        vehicle_id:
          type: integer
          minimum: 1
        driver_id:
          type: integer
          minimum: 1
        planned_departure_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [DRAFT, DISPATCHED, DELIVERED, CANCELLED]
        sales_order_id:
          type: [string, 'null']
        assigned_at:
          type: [string, 'null']
          format: date-time
        assigned_by:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by:
          type: [string, 'null']
        cancellation_reason:
          type: [string, 'null']
          maxLength: 500
        dispatched_at:
          type: [string, 'null']
          format: date-time
        dispatched_by:
          type: [string, 'null']
        delivered_at:
          type: [string, 'null']
          format: date-time
        delivered_by:
          type: [string, 'null']
        planned_load_kg:
          oneOf:
            - $ref: '#/components/schemas/Kilograms'
            - type: 'null'
        capacity_kg:
          oneOf:
            - $ref: '#/components/schemas/Kilograms'
            - type: 'null'
        remaining_capacity_kg:
          oneOf:
            - $ref: '#/components/schemas/Kilograms'
            - type: 'null'
        current_version:
          type: integer
          minimum: 1

    TripLine:
      type: object
      required: [id, trip_id, sales_line_id, product_id, quantity, unit_weight_kg, line_load_kg]
      properties:
        id:
          type: integer
          minimum: 1
        trip_id:
          type: integer
          minimum: 1
        sales_line_id:
          type: string
          maxLength: 40
        product_id:
          type: string
          maxLength: 40
        quantity:
          type: integer
          minimum: 1
          description: Complete original Sales line quantity; it cannot be split across Trips.
        unit_weight_kg:
          $ref: '#/components/schemas/Kilograms'
        line_load_kg:
          $ref: '#/components/schemas/Kilograms'
        delivery_status:
          type: [string, 'null']
          enum: [SUCCESS, null]
        delivered_quantity:
          type: [integer, 'null']
          minimum: 1
        delivered_at:
          type: [string, 'null']
          format: date-time
        delivered_by_driver_id:
          type: [integer, 'null']
        recorded_by_user_id:
          type: [string, 'null']
          maxLength: 40
        source_reference:
          type: [string, 'null']
          maxLength: 100
        product:
          type: object
          readOnly: true
          properties:
            sku:
              type: string
            product_name:
              type: string
            unit:
              type: string
        destination:
          type: object
          readOnly: true
          properties:
            customer_id:
              type: string
            customer_name:
              type: string
            ship_to_name:
              type: string
            address_line1:
              type: string
            address_line2:
              type: [string, 'null']
            city:
              type: string
            state:
              type: [string, 'null']
            postal_code:
              type: [string, 'null']
            country_code:
              type: string
              maxLength: 2

    VehicleEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Vehicle'

    DriverEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Driver'

    TripEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Trip'

    TripLineEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/TripLine'

    DispatchableSalesLine:
      type: object
      required: [sales_order_id, sales_order_version, sales_order_status, sales_line_id, product_id, quantity, unit_weight_kg, line_load_kg]
      properties:
        sales_order_id:
          type: string
        sales_order_reference:
          type: string
        sales_order_version:
          type: integer
          minimum: 1
        sales_order_status:
          type: string
          enum: [SUBMITTED, IN_PROGRESS]
        sales_line_id:
          type: string
          maxLength: 40
        product_id:
          type: string
          maxLength: 40
        quantity:
          type: integer
          minimum: 1
        unit_weight_kg:
          $ref: '#/components/schemas/Kilograms'
        line_load_kg:
          $ref: '#/components/schemas/Kilograms'
        product:
          type: object
          readOnly: true
          properties:
            sku:
              type: string
            product_name:
              type: string
            unit:
              type: string
        destination:
          type: object
          readOnly: true
          properties:
            customer_id:
              type: string
            customer_name:
              type: string
            ship_to_name:
              type: string
            address_line1:
              type: string
            address_line2:
              type: [string, 'null']
            city:
              type: string
            state:
              type: [string, 'null']
            postal_code:
              type: [string, 'null']
            country_code:
              type: string
              maxLength: 2

    DispatchableLinesEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [items, page, page_size]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/DispatchableSalesLine'
                page:
                  type: integer
                page_size:
                  type: integer

    VehicleListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [items, page, page_size]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Vehicle'
                page:
                  type: integer
                page_size:
                  type: integer

    DriverListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [items, page, page_size]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Driver'
                page:
                  type: integer
                page_size:
                  type: integer

    TripListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [items, page, page_size]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Trip'
                page:
                  type: integer
                page_size:
                  type: integer

    TripLinePage:
      type: object
      required: [items, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TripLine'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total_lines:
          type: integer
          minimum: 0
        trip_current_version:
          type: integer
          minimum: 1

    TripLinesEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/TripLinePage'

    TripDetail:
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          required: [vehicle, driver, lines, total_lines]
          properties:
            vehicle:
              $ref: '#/components/schemas/Vehicle'
            driver:
              $ref: '#/components/schemas/Driver'
            lines:
              $ref: '#/components/schemas/TripLinePage'
            total_lines:
              type: integer
              minimum: 0

    TripDetailEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/TripDetail'

    TripDispatchResult:
      type: object
      required: [trip, vehicle, driver, lines, total_lines, total_load_kg]
      properties:
        trip:
          $ref: '#/components/schemas/Trip'
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        driver:
          $ref: '#/components/schemas/Driver'
        lines:
          $ref: '#/components/schemas/TripLinePage'
        total_lines:
          type: integer
          minimum: 0
        total_load_kg:
          $ref: '#/components/schemas/Kilograms'

    TripDispatchEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/TripDispatchResult'

    IdentityResponse:
      type: object
      required: [success, operation_id, current_version, result, error]
      properties:
        success:
          type: boolean
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result:
          type: object
          required: [id, username, company_id, company_name, roles, is_admin, must_change_password, permissions]
          properties:
            id:
              type: [string, integer]
            username:
              type: string
            company_id:
              type: [string, integer]
            company_name:
              type: string
            roles:
              type: array
              items:
                type: string
            is_admin:
              type: boolean
            must_change_password:
              type: boolean
            permissions:
              type: array
              items:
                type: string
        error:
          type: [object, 'null']

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result:
          type: [object, 'null']
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            field_errors:
              type: object
              additionalProperties:
                type: string
            correlation_id:
              type: string

  responses:
    BadRequest:
      description: Invalid field, type, range or unknown field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission, role or ownership restriction
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in the authenticated company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State, version, uniqueness, capacity or resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Database, configuration or required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
