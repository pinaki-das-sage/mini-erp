          type: TIMESTAMP WITH TIME ZONE
          nullable: false
          default: CURRENT_TIMESTAMP
      x-database-constraints:
        - CONSTRAINT ME_OE_PAY_PK PRIMARY KEY (CNY#, RECORD#)
        - CONSTRAINT ME_OE_PAY_COMPANY_FK FOREIGN KEY (CNY#) REFERENCES ME_COMPANY (ID)
        - CONSTRAINT ME_OE_PAY_INVOICE_FK FOREIGN KEY (CNY#, INVOICE_RECORD#) REFERENCES ME_OE_DOCUMENTS (CNY#, RECORD#)
        - CONSTRAINT ME_OE_PAY_ACTION_FK FOREIGN KEY (CNY#, ACTION_REFERENCE) REFERENCES ME_ACTIONS (COMPANY_ID, ACTION_REFERENCE)
        - CONSTRAINT ME_OE_PAY_NUMBER_UK UNIQUE (CNY#, PAYMENT_NUMBER)
        - CONSTRAINT ME_OE_PAY_ACTION_UK UNIQUE (CNY#, ACTION_REFERENCE)
        - CONSTRAINT ME_OE_PAY_AMOUNT_CK CHECK (PAYMENT_AMOUNT > 0)
      properties:
        RECORD#:
          type: integer
          minimum: 1
          maximum: 999999999999999
          default: AS
          x-oracle-type: NUMBER(15)
          x-database-identity: GENERATED BY DEFAULT AS IDENTITY
        CNY#:
          type: integer
          minimum: -9999999999
          maximum: 9999999999
          x-oracle-type: NUMBER(10)
        PAYMENT_NUMBER:
          type: string
          maxLength: 20
          x-oracle-type: VARCHAR2(20 CHAR)
        INVOICE_RECORD#:
          type: integer
          minimum: -999999999999999
          maximum: 999999999999999
          x-oracle-type: NUMBER(15)
        PAYMENT_AMOUNT:
          type: string
          pattern: ^[0-9]{1,16}(?:\.[0-9]{1,2})?$
          description: Exact nonnegative Oracle decimal serialized as a string; database CHECK constraints apply.
          x-oracle-type: NUMBER(18,2)
        PAYMENT_DATE:
          type: string
          format: date
          description: Business date serialized as YYYY-MM-DD.
          x-oracle-type: DATE
        PAYMENT_REFERENCE:
          type: string
          maxLength: 50
          x-oracle-type: VARCHAR2(50 CHAR)
        ACTION_REFERENCE:
          type: string
          maxLength: 100
          x-oracle-type: VARCHAR2(100)
        WHENCREATED:
          type: string
          format: date-time
          x-oracle-type: TIMESTAMP WITH TIME ZONE
          x-database-default: CURRENT_TIMESTAMP
        WHENMODIFIED:
          type: string
          format: date-time
          x-oracle-type: TIMESTAMP WITH TIME ZONE
          x-database-default: CURRENT_TIMESTAMP
      required:
        - RECORD#
        - CNY#
        - PAYMENT_NUMBER
        - INVOICE_RECORD#
        - PAYMENT_AMOUNT
        - PAYMENT_DATE
        - PAYMENT_REFERENCE
        - ACTION_REFERENCE
        - WHENCREATED
        - WHENMODIFIED
      additionalProperties: false
      x-database-checks:
        - PAYMENT_AMOUNT > 0
      x-database-indexes:
        - name: ME_OE_PAY_INVOICE_IX
          columns:
            - CNY#
            - INVOICE_RECORD#
    QuoteLineInput:
      type: object
      required: [ product_id, description, quantity, unit_price ]
      properties:
        line_id: { $ref: "#/components/schemas/SalesLineInput/properties/line_id" }
        product_id:
          type: string
          minLength: 1
          description: Existing Inventory product ID. Verify the sample ID against the connected Inventory data.
        description: { $ref: "#/components/schemas/SalesLineInput/properties/description" }
        quantity: { $ref: "#/components/schemas/SalesQuantity" }
        unit_price: { $ref: "#/components/schemas/SalesUnitPrice" }
    PlanningTripLineEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/PlanningTripLine'
    PlanningTripLine:
      type: object
      description: >
        Saved line snapshot with current related details. For cancelled trips (X), only trip details are expanded; sales_line and product are null. Snapshot source IDs, quantities and weights remain available at the top level.
      required: [ id, trip_id, sales_line_id, product_id, quantity, total_weight, line_load, created_at, updated_at, trip, sales_line, product ]
      properties:
        id:
          type: integer
        trip_id:
          type: integer
        sales_line_id:
          type: integer
        product_id:
          type: integer
        quantity:
          type: integer
        total_weight:
          type: number
          format: double
          description: Full line weight in KG derived from Inventory unit grams and Sales quantity.
        line_load:
          type: number
          format: double
          description: Same full line KG weight, used for vehicle capacity checks.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time
        trip:
          anyOf:
            - $ref: '#/components/schemas/TripLineTripDetails'
            - type: 'null'
        sales_line:
          description: Null for cancelled/missing trips or when the saved line does not belong to the trip's Sales Order.
          anyOf:
            - $ref: '#/components/schemas/TripLineSalesDetails'
            - type: 'null'
        product:
          description: Follows sales_line.product_id; null when the trip is cancelled or the Sales line/product cannot be resolved.
          anyOf:
            - $ref: '#/components/schemas/TripLineProductDetails'
            - type: 'null'
    TripLineProductDetails:
      type: object
      description: Inventory product reached through the matching Sales line; warehouse and SKU codes remain strings.
      properties:
        id:
          type: integer
        product_name:
          type: string
        sku:
          type: string
        warehouse_id:
          type: string
        unit_label:
          type: string
        unit_weight_grams:
          type: number
          format: double
        is_active:
          type: string
        when_created:
          type: string
          format: date-time
        when_updated:
          type: [ string, 'null' ]
          format: date-time
        stock_balance:
          description: Current company/product balance, not historical stock at delivery; null if no balance row exists.
          anyOf:
            - $ref: '#/components/schemas/TripLineStockBalance'
            - type: 'null'
    TripLineStockBalance:
      type: object
      required: [ product_id, on_hand, reserved, available, when_updated ]
      properties:
        product_id:
          type: integer
        on_hand:
          type: integer
        reserved:
          type: integer
        available:
          type: integer
          description: Database-calculated on_hand minus reserved.
        when_updated:
          type: string
          format: date-time
    TripLineSalesDetails:
      type: object
      description: Sales line matched by company, the trip's sales_order_id and the saved sales_line_id.
      properties:
        id:
          type: integer
        document_record_id:
          type: integer
        line_number:
          type: integer
        product_id:
          type: integer
        description:
          type: [ string, 'null' ]
        quantity:
          type: integer
        unit_price:
          type: number
          format: double
        source_line_record_id:
          type: [ integer, 'null' ]
        trip_id:
          type: [ integer, 'null' ]
        logistics_trip_line_id:
          type: [ integer, 'null' ]
        trip_status:
          type: [ string, 'null' ]
        whencreated:
          type: string
          format: date-time
        whenmodified:
          type: string
          format: date-time
    TripLineTripDetails:
      type: object
      description: Parent trip details; creator, updater and company data are excluded.
      properties:
        id:
          type: integer
        trip_code:
          type: integer
        vehicle_id:
          type: integer
        driver_id:
          type: integer
        sales_order_id:
          type: integer
        status:
          type: string
          enum: [ D, S, C, X ]
        planned_departure_at:
          type: string
          format: date-time
        assigned_at:
          type: string
          format: date-time
        assigned_by:
          type: [ integer, 'null' ]
        cancelled_at:
          type: [ string, 'null' ]
          format: date-time
        cancelled_by:
          type: [ integer, 'null' ]
        cancellation_reason:
          type: [ string, 'null' ]
        dispatched_at:
          type: [ string, 'null' ]
          format: date-time
        dispatched_by:
          type: [ integer, 'null' ]
        delivered_at:
          type: [ string, 'null' ]
          format: date-time
        delivered_by:
          type: [ integer, 'null' ]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: [ string, 'null' ]
          format: date-time
    PlanningTripLineListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [ items, page, page_size ]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/PlanningTripLine'
                page:
                  type: integer
                page_size:
                  type: integer

  responses:
    BadRequest:
      description: Invalid field, type, range or unknown field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission, role or ownership restriction
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in the authenticated company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State, version, uniqueness, capacity or resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Database, configuration or required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error:
      description: |-
        400 validation; 401 unauthenticated; 403 forbidden; 404 not found; 409 state/source/revision conflict; 415 JSON required; 500 server error; 503 dependency unavailable.
        Exact business validation messages:
        - Missing required field: Enter {Field label}.
        - Overlength: {Field label} must be {limit} characters or fewer.
        - Customer Code cannot be changed after creation.
        - Customer Code may contain only letters, numbers and hyphens.
        - Enter a valid Email Address.
        - Enter a valid Phone Number.
        - Enter Country.
        - Country must be 80 characters or fewer.
        - Select a valid Is Active value (T or F).
        - Select valid Payment Terms.
        - Amount Customer Owes Us is calculated and cannot be edited.
        - Customer Code already exists. Enter a unique code.
        - This document has changed. Refresh and try again.
        - This action reference belongs to a different request.
        - Enter {Field label}. / {Field label} must be {limit} characters or fewer.
        - Add at least one item line.
        - Select a valid {Field label} available to your company.
        - Selected {Customer / Item / Warehouse} is inactive. Select an active record.
        - Enter a valid {Date label} in YYYY-MM-DD format.
        - {Date label} must be on or after {Earlier date label}.
        - From Date must be on or before To Date.
        - Line {n}: Select a valid line belonging to this document.
        - Line {n}: Duplicate line identifier.
        - Line {n}: Select an active Item available to your company.
        - Line {n}: Enter Description. / Line {n}: Description must be 200 characters or fewer.
        - Line {n}: Enter a positive whole Quantity with up to 9 digits.
        - Line {n}: Enter Unit Price of 0 or more, with up to 10 whole digits and 2 decimal places.
        - Line {n}: Warehouse must match the document Warehouse.
        - Line {n}: Line Amount is calculated and cannot be edited.
        - Document Total is calculated and cannot be edited.
        - {Line Amount / Document Total} exceeds the allowed numeric limit.
        - Use the available action to change Document Status.
        - Only Draft documents can be edited.
        - Only a saved Draft can be submitted.
        - Only Submitted documents can move to Draft.
        - Cannot move to Draft: this document is used as a source by {Document number}.
        - Only Draft documents with no downstream documents can be deleted.
        - Selected source is no longer available. Refresh and select another eligible source.
        - Cannot move to Draft: a payment has been recorded for this Invoice.
        - Enter Payment Amount. / Enter a valid Payment Amount.
        - Payment Amount must be greater than 0.
        - Payment Amount can have at most 2 decimal places.
        - Payment Amount exceeds the allowed numeric limit.
        - Payment Amount cannot exceed Amount Due ({current amount due}).
        - Enter Payment Reference.
        - Payment Reference must be 50 characters or fewer.
        - Enter Payment Date.
        - Enter a valid Payment Date in YYYY-MM-DD format.
        - Payment Date must be on or after Invoice Date.
        - Payment Date cannot be in the future.
        - Submit the Invoice before recording a payment.
        - This Invoice is fully paid. No further payment can be recorded.
        - Amount Due has changed to {current amount due}. Review the amount and try again.
        - {Field label} must match the source document.
        - Source-linked lines cannot be added, changed or removed.
        - {Date label} cannot be in the future.
        - You do not have permission to perform this action.
        - Invoice Total must be greater than 0.
        - In Progress and Closed are updated by Logistics and cannot be changed manually.
        - Cannot move to Draft: this Order is assigned to a Logistics Trip.
        - Cannot move to Draft: Order is In Progress or Closed.
        - Invoice must retain its automatically linked Submitted, In Progress or Closed Order.
        - Selected Order is already used by another Invoice.
      headers: { WWW-Authenticate: { description: Present for HTTP 401., schema: { type: string } } }
      content: { application/json: { schema: { $ref: "#/components/schemas/SalesErrorResponse" } } }
