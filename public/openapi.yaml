openapi: 3.1.0
info:
  title: Mini ERP Authentication and Purchasing API
  version: 1.12.5
  description: Sample requests and expected responses for the current merged fields. HTTP 400 examples
    identify error.field and error.message; line errors include the line number in the message. These are
    documented expectations, not live backend validation results.
servers:
  - url: ./api/v1
    description: API relative to this OpenAPI file's deployment directory
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Vendors
  - name: Purchasing Documents
  - name: Purchasing Document Entries
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: login
      summary: Login to Mini ERP
      description: >
        Authenticate an active user in an active company and issue an opaque bearer token. Send JSON
        without an Authorization header. Company codes and usernames are trimmed and normalized;
        passwords are case-sensitive. Tokens expire after the configured lifetime (one hour by default).
        Login is limited to five attempts per company/username and 100 attempts per source IP per fixed
        one-minute window, including successful attempts.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
            example:
              company: SIA-MINI-ERP
              username: your-username
              password: your-password
      responses:
        "200":
          description: Login successful. Store the token securely; do not log it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing or invalid fields, malformed JSON, or an Authorization header was supplied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid company, username or password, or an inactive account/company.
          headers:
            WWW-Authenticate:
              schema:
                type: string
                const: Bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                operation_id: null
                current_version: null
                result: null
                error:
                  code: UNAUTHENTICATED
                  message: Invalid company, username or password.
        "415":
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts. Retry after 60 seconds.
          headers:
            Retry-After:
              schema:
                type: string
                const: "60"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                operation_id: null
                current_version: null
                result: null
                error:
                  code: RATE_LIMITED
                  message: Too many login attempts. Try again after one minute.
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Database or authentication configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      tags:
        - Authentication
      operationId: getCurrentUser
      summary: Verify token and get current user
      description: Returns the identity and current permissions associated with the supplied token.
      responses:
        "200":
          description: Valid token and current user identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "503":
          $ref: "#/components/responses/Unavailable"
  /purchasing/vendors:
    get:
      tags:
        - Vendors
      operationId: listVendors
      summary: List vendors
      description: Returns two initial dummy vendors (101 and 102), plus vendors created through POST in this
        tab. Supports pagination, search and status filters. Use GET /purchasing/vendors/{id} for a
        single vendor.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: search
          in: query
          description: Search vendor name or vendor number.
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
      responses:
        "200":
          description: Vendor list matching the filters and requested page.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/Vendor"
                  error:
                    type: "null"
              examples:
                vendors:
                  $ref: "#/components/examples/VendorListSuccess"
        "400":
          $ref: "#/components/responses/VendorListValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags:
        - Vendors
      operationId: createVendor
      summary: Create vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorCreate"
            examples:
              vendor:
                $ref: "#/components/examples/VendorCreateRequest"
        description: >-
          Input fields must have concrete values; null is not accepted. Omit optional fields when no
          value is available.


          Enter only the request fields shown in the examples. cnyid, id, createdby, modifiedby,
          whencreated and whenmodified are assigned by the server and cannot be supplied. GET responses
          retain the full saved record.


          | Field | Rule |

          | --- | --- |

          | `vendor_id` | Required; 1-20 letters, numbers or hyphens; unique within company; immutable
          after save. |

          | `name` | Required; trim surrounding spaces; must not be blank; maximum 100 characters. |

          | `status` | active or inactive; default active. Deactivate/reactivate through authorized
          update; preserve historical documents. |

          | `contact` | Optional; maximum 100 characters; omit when not supplied. |

          | `email` | Optional; maximum 100 characters; validate email format when supplied; omit when
          not supplied. |

          | `phone` | Optional 10-digit Indian mobile number, starting with 6-9; for example 9876543210.
          No country code or spaces. |

          | `addr_1` | Required, nonblank; maximum 150 characters. |

          | `addr_2` | Optional; maximum 250 characters; omit when not supplied. |

          | `city` | Required, nonblank; maximum 80 characters. |

          | `state` | Optional; maximum 80 characters; omit when not supplied. |

          | `postal_code` | Optional string; maximum 10 letters/numbers; preserve leading zeros; omit
          when not supplied. |

          | `country` | Required, nonblank free text; maximum 80 characters. |

          | `payment_terms` | due_on_receipt, net_15 or net_30; default net_30. |
      responses:
        "201":
          $ref: "#/components/responses/VendorResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /purchasing/vendors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Internal string ID from a me_pur_vendor response, not the business vendor_id.
        schema:
          type: string
          example: "101"
          minLength: 1
          maxLength: 40
    get:
      tags:
        - Vendors
      operationId: getVendor
      summary: Get vendor
      responses:
        "200":
          description: Current me_pur_vendor record for the authenticated company.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    $ref: "#/components/schemas/VendorResponse"
                  error:
                    type: "null"
              examples:
                vendor:
                  $ref: "#/components/examples/VendorReadSuccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
      description: Enter the id returned by POST /purchasing/vendors to retrieve that vendor. In Swagger dummy
        mode, ID 101 is available initially and created vendors remain available until this tab reloads.
    patch:
      tags:
        - Vendors
      operationId: updateVendor
      summary: Update vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorUpdate"
            examples:
              vendor:
                $ref: "#/components/examples/VendorUpdateRequest"
      responses:
        "200":
          description: Vendor updated successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - cnyid
                      - name
                      - message
                    properties:
                      id:
                        type: string
                        description: Generated by the server; cannot be entered by the user.
                        readOnly: true
                        maxLength: 40
                        x-oracle-type: VARCHAR2(40)
                        minLength: 1
                      cnyid:
                        type: integer
                        minimum: 1
                        description: Assigned by the server from the authenticated company; cannot be entered by the user.
                        readOnly: true
                        maximum: 9999999999
                        x-oracle-type: NUMBER(10)
                      name:
                        type: string
                        maxLength: 100
                        x-oracle-type: VARCHAR2(100)
                      message:
                        type: string
                  error:
                    type: "null"
              examples:
                updated:
                  $ref: "#/components/examples/VendorUpdatedSuccess"
        "400":
          $ref: "#/components/responses/VendorUpdateValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/Unavailable"
  /purchasing/documents:
    get:
      tags:
        - Purchasing Documents
      operationId: listPurchaseDocuments
      summary: List purchasing documents
      responses:
        "200":
          description: Sample document list.
          content:
            application/json:
              examples:
                documents:
                  $ref: "#/components/examples/PurchaseDocumentListSuccess"
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/PurchaseDocument"
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Purchasing Documents
      operationId: createPurchaseDocument
      summary: Create purchasing document
      requestBody:
        required: true
        content:
          application/json:
            examples:
              order:
                $ref: "#/components/examples/PurchaseOrderRequest"
              receiver:
                $ref: "#/components/examples/ReceiverRequest"
              invoice:
                $ref: "#/components/examples/VendorInvoiceRequest"
            schema:
              $ref: "#/components/schemas/PurchaseDocumentCreate"
        description: Create the document and all entries together. docno and vendor_id are inputs. recordtype may
          be order, receiver or invoice; if omitted it is inferred from the docno prefix. Entry IDs,
          company, audit fields and parent links are assigned automatically. Optional doc_id must match
          the generated parent ID. lineamount is calculated and a supplied value must match it. Null
          input values are not accepted.
      responses:
        "201":
          description: Purchasing document created successfully. name contains the generated document number.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    type: object
                    additionalProperties: false
                    required:
                      - id
                      - cnyid
                      - name
                      - message
                    properties:
                      id:
                        type: string
                        description: Generated by the server; cannot be entered by the user.
                        readOnly: true
                        maxLength: 40
                        x-oracle-type: VARCHAR2(40)
                        minLength: 1
                      cnyid:
                        type: integer
                        minimum: 1
                        description: Assigned by the server from the authenticated company; cannot be entered by the user.
                        readOnly: true
                        maximum: 9999999999
                        x-oracle-type: NUMBER(10)
                      name:
                        type: string
                        maxLength: 100
                        x-oracle-type: VARCHAR2(100)
                      message:
                        type: string
                  error:
                    type: "null"
              examples:
                purchaseOrder:
                  $ref: "#/components/examples/PurchaseOrderCreatedSuccess"
                receiver:
                  $ref: "#/components/examples/ReceiverCreatedSuccess"
                vendorInvoice:
                  $ref: "#/components/examples/VendorInvoiceCreatedSuccess"
        "400":
          $ref: "#/components/responses/PurchaseDocumentValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/PurchaseDocumentConflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /purchasing/documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: "202"
          minLength: 1
          maxLength: 40
    get:
      tags:
        - Purchasing Documents
      operationId: getPurchaseDocument
      summary: Get purchasing document
      responses:
        "200":
          $ref: "#/components/responses/PurchaseDocumentResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PurchaseDocumentNotFound"
      description: "Returns the document with its entries array. Every entry doc_id matches the document id.
        Dummy documents: 201 and 202."
    patch:
      tags:
        - Purchasing Documents
      operationId: updatePurchaseDocument
      summary: Update purchasing document
      requestBody:
        required: true
        content:
          application/json:
            examples:
              document:
                $ref: "#/components/examples/PurchaseDocumentUpdateRequest"
            schema:
              $ref: "#/components/schemas/PurchaseDocumentUpdate"
        description: Update payment_terms/status and optionally entries in one request. An entry with id updates
          only description/notes; optional lineno must match its saved line. An entry without id adds a
          new line. New entries may supply doc_id matching this document. All changes succeed together or
          none are saved.
      responses:
        "200":
          description: Only the submitted header fields and affected entry fields are returned inside result. Use
            GET for the full saved document and generated entry IDs.
          content:
            application/json:
              examples:
                document:
                  $ref: "#/components/examples/PurchaseDocumentUpdatedSuccess"
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    $ref: "#/components/schemas/PurchaseDocumentUpdate"
                  error:
                    type: "null"
        "400":
          $ref: "#/components/responses/PurchaseDocumentUpdateValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PurchaseDocumentNotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /purchasing/document-entries:
    get:
      tags:
        - Purchasing Document Entries
      operationId: listPurchaseDocumentEntries
      summary: List document entries
      parameters:
        - name: doc_id
          in: query
          schema:
            type: string
            example: "201"
            minLength: 1
            maxLength: 40
      responses:
        "200":
          description: Sample document entry list.
          content:
            application/json:
              examples:
                entry:
                  $ref: "#/components/examples/PurchaseDocumentEntryListSuccess"
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/PurchaseDocumentEntry"
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /purchasing/document-entries/{record}:
    parameters:
      - name: record
        in: path
        required: true
        description: String ID from ME_PUR_DOC_ENTRY.
        schema:
          type: string
          minLength: 1
          maxLength: 40
          example: "501"
    get:
      tags:
        - Purchasing Document Entries
      operationId: getPurchaseDocumentEntry
      summary: Get document entry
      responses:
        "200":
          description: Sample document entry.
          content:
            application/json:
              examples:
                entry:
                  $ref: "#/components/examples/PurchaseDocumentEntryReadSuccess"
              schema:
                type: object
                additionalProperties: false
                required:
                  - success
                  - operation_id
                  - current_version
                  - result
                  - error
                properties:
                  success:
                    type: boolean
                    const: true
                  operation_id:
                    type: "null"
                  current_version:
                    type: "null"
                  result:
                    $ref: "#/components/schemas/PurchaseDocumentEntry"
                  error:
                    type: "null"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/PurchaseDocumentEntryNotFound"
      description: Read an entry by ID. Entries are created and updated through the parent document POST/PATCH.
components:
  examples:
    PurchaseDocumentEntryRead:
      summary: Sample read JSON response
      value:
        cnyid: 7
        id: "501"
        doc_id: "202"
        lineno: 1
        product_id: 1001
        description: Office chair
        quantity: 2
        unitcost: 125.5
        lineamount: 251
        notes: Deliver to reception
        createdby: user-001
        modifiedby: user-001
        whencreated: 2026-11-18T09:00:00.000Z
