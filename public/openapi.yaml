openapi: 3.1.0

info:
  title: Mini ERP Logistics API
  description: >
    OpenAPI contract for the Mini ERP Logistics module. This document describes
    API routes and payloads. It does not implement the backend. Confirm the
    deployed application base URL, credentials, and permission names with the team.
  version: 1.0.0

servers:
  - url: ./api/v1
    description: Versioned API base URL

tags:
  - name: Authentication
  - name: Vehicles
  - name: Drivers
  - name: Trips
  - name: Metadata

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login to Mini ERP
      description: Authenticate a user and generate an access token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company, username, password]
              properties:
                company:
                  type: string
                  example: SIA-MINI-ERP
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: admin
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the current user
      description: Verify the bearer token and return the caller's identity, roles and permissions.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /meta/permissions:
    get:
      tags: [Metadata]
      summary: List registered permissions
      operationId: getPermissions
      responses:
        '200':
          description: Registered permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /meta/enums:
    get:
      tags: [Metadata]
      summary: Get API enumeration values
      operationId: getEnums
      responses:
        '200':
          description: Enumeration values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /meta/contract:
    get:
      tags: [Metadata]
      summary: Get API contract metadata
      operationId: getContract
      responses:
        '200':
          description: API contract metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'

  /logistics/vehicles:
    post:
      tags: [Vehicles]
      summary: Create a vehicle
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Command'
                - type: object
                  required: [vehicle_code, registration_number, capacity_kg]
                  properties:
                    vehicle_code:
                      type: integer
                      minimum: 1
                      example: 30
                    registration_number:
                      type: string
                      maxLength: 40
                      example: KA01AB1234
                    capacity_kg:
                      $ref: '#/components/schemas/PositiveKilograms'
                    description:
                      type: [string, 'null']
                      maxLength: 255
                    active:
                      type: boolean
                      default: true
      responses:
        '201':
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Vehicles]
      summary: List vehicles
      operationId: listVehicles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: active
          in: query
          schema:
            type: boolean
        - name: assignment_status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, ASSIGNED]
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paged vehicle list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/vehicles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Vehicles]
      summary: Get a vehicle
      operationId: getVehicle
      responses:
        '200':
          description: Vehicle details and availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Vehicles]
      summary: Update a vehicle
      operationId: updateVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/VersionedCommand'
                - type: object
                  properties:
                    vehicle_code:
                      type: integer
                      minimum: 1
                    registration_number:
                      type: string
                      maxLength: 40
                    capacity_kg:
                      $ref: '#/components/schemas/PositiveKilograms'
                    description:
                      type: [string, 'null']
                      maxLength: 255
                    active:
                      type: boolean
      responses:
        '200':
          description: Vehicle updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Vehicles]
      summary: Delete a never-used vehicle
      operationId: deleteVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedCommand'
      responses:
        '200':
          description: Vehicle deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/drivers:
    post:
      tags: [Drivers]
      summary: Create a driver profile
      operationId: createDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [driver_code, first_name, last_name, licence_number, licence_expiry]
                  properties:
                    driver_code:
                      type: string
                      maxLength: 30
                    user_id:
                      type: [integer, 'null']
                      minimum: 1
                    first_name:
                      type: string
                      maxLength: 100
                    last_name:
                      type: string
                      maxLength: 100
                    phone:
                      type: [string, 'null']
                      maxLength: 30
                    licence_number:
                      type: string
                      maxLength: 50
                    licence_expiry:
                      type: string
                      format: date
                    isactive:
                      type: string
                      enum: ['T', 'F']
                      default: 'T'
      responses:
        '201':
          description: Driver created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Drivers]
      summary: List drivers
      operationId: listDrivers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged driver list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverListEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/drivers/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Drivers]
      summary: Get a driver
      operationId: getDriver
      responses:
        '200':
          description: Driver details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /logistics/drivers/{id}/update:
    post:
      tags: [Drivers]
      summary: Update a driver profile
      operationId: updateDriver
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driver_code, first_name, last_name, licence_number, licence_expiry]
              properties:
                driver_code:
                  type: string
                  maxLength: 30
                user_id:
                  type: [integer, 'null']
                  minimum: 1
                first_name:
                  type: string
                  maxLength: 100
                last_name:
                  type: string
                  maxLength: 100
                phone:
                  type: [string, 'null']
                  maxLength: 30
                licence_number:
                  type: string
                  maxLength: 50
                licence_expiry:
                  type: string
                  format: date
                isactive:
                  type: string
                  enum: ['T', 'F']
      responses:
        '200':
          description: Driver updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /logistics/drivers/{id}/delete:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Drivers]
      summary: Delete or deactivate a driver profile
      description: >
        A driver never referenced by a Trip may be deleted. A driver with
        historical Trip references is deactivated. A driver assigned to an
        active Trip cannot be deleted or deactivated.
      operationId: deleteDriver
      requestBody:
        required: true
        description: The API requires a JSON content type on writes; send an empty object.
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
            example: {}
      responses:
        '200':
          description: Empty object returned after the driver is deleted or deactivated
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/driver-users:
    get:
      tags: [Drivers]
      summary: List eligible same-company driver user accounts
      operationId: listEligibleDriverUsers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Eligible driver user accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/trips:
    post:
      tags: [Trips]
      summary: Create a Draft Trip from one complete Submitted Sales Order
      description: >
        One whole Submitted Sales Order becomes one Draft Trip and every Sales
        Order line becomes a TripLine. Draft creation leaves Sales Submitted.
        Line weight and load are derived from Inventory, never supplied by the client.
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [order_number, trip_reference, vehicle_id, driver_id, planned_departure_at]
              properties:
                order_number:
                  type: string
                  example: SO-1001
                trip_reference:
                  type: integer
                  minimum: 1
                  example: 1001
                vehicle_id:
                  type: integer
                  minimum: 1
                driver_id:
                  type: integer
                  minimum: 1
                planned_departure_at:
                  type: string
                  format: date-time
                  example: '2026-11-26T10:00:00+05:30'
      responses:
        '201':
          description: Draft trip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Trips]
      summary: List trips
      operationId: listTrips
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged trips
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /logistics/trips/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Trips]
      summary: Get a trip
      operationId: getTrip
      responses:
        '200':
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /logistics/trips/{id}/update:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Update a Draft trip's Vehicle, Driver and planned departure
      operationId: updateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehicle_id, driver_id, planned_departure_at]
              properties:
                vehicle_id:
                  type: integer
                  minimum: 1
                driver_id:
                  type: integer
                  minimum: 1
                planned_departure_at:
                  type: string
                  format: date-time
                  example: '2026-11-26T11:00:00+05:30'
      responses:
        '200':
          description: Draft trip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Cancel a Draft trip
      description: Notifies Sales in the same transaction; the Sales Order must be Submitted and stays Submitted.
      operationId: cancelTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: Vehicle unavailable
      responses:
        '200':
          description: Trip cancelled and resources released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /logistics/trips/{id}/dispatch:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Dispatch a Draft trip
      description: >
        Draft -> Dispatched. Consumes the Inventory reservations, records the
        dispatch with Sales (Submitted -> In Progress) in one transaction
        shared by Logistics, Inventory and Sales.
      operationId: dispatchTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
              example: {}
      responses:
        '200':
          description: Trip dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /logistics/trips/{id}/deliver:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Trips]
      summary: Complete delivery of a Dispatched trip
      description: >
        Dispatched -> Delivered. Notifies Sales through recordDelivery() in
        the same transaction (In Progress -> Closed). No invoice is created
        during delivery.
      operationId: deliverTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
              example: {}
      responses:
        '200':
          description: Trip delivered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    Command:
      type: object
      required: [action_reference]
      properties:
        action_reference:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-z0-9_-]+$'
          example: action-001

    VersionedCommand:
      allOf:
        - $ref: '#/components/schemas/Command'
        - type: object
          required: [expected_version]
          properties:
            expected_version:
              type: integer
              minimum: 1
              example: 1

    Kilograms:
      type: string
      description: Decimal kilogram value represented as a string.
      pattern: '^[0-9]+(\.[0-9]{1,3})?$'
      example: '30.000'

    PositiveKilograms:
      type: string
      description: Positive decimal kilogram value with at most three fractional digits.
      pattern: '^(?=.*[1-9])[0-9]+(\.[0-9]{1,3})?$'
      example: '30.000'

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 3600
            expires_at:
              type: string
              format: date-time
            must_change_password:
              type: boolean
        error:
          type: [object, 'null']

    GenericSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result: {}
        error:
          type: [object, 'null']

    Vehicle:
      type: object
      required: [id, vehicle_code, registration_number, capacity_kg, active, assignment_status, current_version]
      properties:
        id:
          type: integer
          minimum: 1
        vehicle_code:
          type: integer
          minimum: 1
        registration_number:
          type: string
          maxLength: 40
        description:
          type: [string, 'null']
          maxLength: 255
        capacity_kg:
          $ref: '#/components/schemas/PositiveKilograms'
        active:
          type: boolean
        assignment_status:
          type: string
          enum: [AVAILABLE, ASSIGNED]
        active_trip_id:
          type: [integer, 'null']
        current_version:
          type: integer
          minimum: 1

    Driver:
      type: object
      required: [id, driver_code, first_name, last_name, licence_number, licence_expiry, isactive]
      properties:
        id:
          type: integer
          minimum: 1
        driver_code:
          type: string
          maxLength: 30
        user_id:
          type: [integer, 'null']
          minimum: 1
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        phone:
          type: [string, 'null']
          maxLength: 30
        licence_number:
          type: string
          maxLength: 50
        licence_expiry:
          type: string
          format: date
        isactive:
          type: string
          enum: ['T', 'F']

    Trip:
      type: object
      required: [id, trip_reference, vehicle_id, driver_id, planned_departure_at, status, sales_order_id, assigned_at, assigned_by, cancelled_at, cancelled_by, cancellation_reason, dispatched_at, dispatched_by, delivered_at, delivered_by, planned_load_kg, capacity_kg, remaining_capacity_kg]
      properties:
        id:
          type: integer
          minimum: 1
        trip_reference:
          type: integer
          minimum: 1
        vehicle_id:
          type: integer
          minimum: 1
        driver_id:
          type: integer
          minimum: 1
        planned_departure_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [DRAFT, DISPATCHED, DELIVERED, CANCELLED]
        sales_order_id:
          type: integer
          minimum: 1
        assigned_at:
          type: [string, 'null']
          format: date-time
        assigned_by:
          type: [integer, 'null']
          description: Numeric ME_USERS.ID.
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by:
          type: [integer, 'null']
        cancellation_reason:
          type: [string, 'null']
          maxLength: 500
        dispatched_at:
          type: [string, 'null']
          format: date-time
        dispatched_by:
          type: [integer, 'null']
        delivered_at:
          type: [string, 'null']
          format: date-time
        delivered_by:
          type: [integer, 'null']
        planned_load_kg:
          type: number
          description: SUM(ME_LOG_TRIP_LINES.LINE_LOAD) in kilograms.
        capacity_kg:
          type: number
        remaining_capacity_kg:
          type: number

    VehicleEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Vehicle'

    DriverEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Driver'

    TripEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              $ref: '#/components/schemas/Trip'

    VehicleListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [items, page, page_size]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Vehicle'
                page:
                  type: integer
                page_size:
                  type: integer

    DriverListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [items, page, page_size]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Driver'
                page:
                  type: integer
                page_size:
                  type: integer

    TripListEnvelope:
      allOf:
        - $ref: '#/components/schemas/GenericSuccess'
        - type: object
          properties:
            result:
              type: object
              required: [items, page, page_size]
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/Trip'
                page:
                  type: integer
                page_size:
                  type: integer

    IdentityResponse:
      type: object
      required: [success, operation_id, current_version, result, error]
      properties:
        success:
          type: boolean
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result:
          type: object
          required: [id, username, company_id, company_name, roles, is_admin, must_change_password, permissions]
          properties:
            id:
              type: [string, integer]
            username:
              type: string
            company_id:
              type: [string, integer]
            company_name:
              type: string
            roles:
              type: array
              items:
                type: string
            is_admin:
              type: boolean
            must_change_password:
              type: boolean
            permissions:
              type: array
              items:
                type: string
        error:
          type: [object, 'null']

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        operation_id:
          type: [string, 'null']
        current_version:
          type: [integer, 'null']
        result:
          type: [object, 'null']
        error:
          type: object
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            field_errors:
              type: object
              additionalProperties:
                type: string
            correlation_id:
              type: string

  responses:
    BadRequest:
      description: Invalid field, type, range or unknown field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid or expired authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission, role or ownership restriction
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in the authenticated company
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State, version, uniqueness, capacity or resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Database, configuration or required dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'