  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Paste result.access_token from a successful login response without the Bearer prefix. Verify
        with GET /auth/me.
  schemas:
    Login:
      type: object
      required:
        - company
        - username
        - password
      properties:
        company:
          type: string
          minLength: 1
          description: Company code, not the company display name.
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    LoginResponse:
      type: object
      required:
        - success
        - operation_id
        - current_version
        - result
        - error
      properties:
        success:
          type: boolean
          const: true
        operation_id:
          type: "null"
        current_version:
          type: "null"
        result:
          $ref: "#/components/schemas/LoginResult"
        error:
          type: "null"
    LoginResult:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - expires_at
        - must_change_password
      properties:
        access_token:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: Opaque token issued by the server, not a JWT.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 60
          maximum: 86400
          example: 3600
        expires_at:
          type: string
          format: date-time
          description: Token expiry timestamp in UTC.
        must_change_password:
          type: boolean
          description: Temporary-password accounts must change their password before using protected business APIs.
    ErrorResponse:
      type: object
      required:
        - success
        - operation_id
        - current_version
        - result
        - error
      properties:
        success:
          type: boolean
          const: false
        operation_id:
          type: "null"
        current_version:
          type: "null"
        result:
          type: "null"
        error:
          $ref: "#/components/schemas/ApiError"
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          description: Diagnostic reference when supplied by the server.
        field:
          type: string
          description: Input field associated with a validation or duplicate-ID error, when applicable.
    Envelope:
      type: object
      required:
        - success
        - operation_id
        - current_version
        - result
        - error
      properties:
        success:
          type: boolean
        operation_id:
          type:
            - string
            - "null"
        current_version:
          type:
            - integer
            - "null"
        result:
          type:
            - object
            - "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/ApiError"
            - type: "null"
    IdentityResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            result:
              type: object
              required:
                - id
                - username
                - company_id
                - company_name
                - roles
                - is_admin
                - must_change_password
                - permissions
              properties:
                id:
                  type: string
                username:
                  type: string
                company_id:
                  type: integer
                company_name:
                  type: string
                roles:
                  type: array
                  items:
                    type: string
                is_admin:
                  type: boolean
                must_change_password:
                  type: boolean
                permissions:
                  type: array
                  items:
                    type: string
    VendorFields:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          description: Vendor Name. Trim spaces; must not be blank.
          x-oracle-type: VARCHAR2(100)
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
          description: Status. Active or Inactive; defaults to active on create. Use update to deactivate/reactivate.
          maxLength: 10
          x-oracle-type: VARCHAR2(10)
        contact:
          type: string
          maxLength: 100
          description: Contact Name. Optional primary sales or order contact.
          x-oracle-type: VARCHAR2(100)
        email:
          type: string
          format: email
          maxLength: 100
          description: Email Address. Validate format when entered; omit the field when no value is available.
          x-oracle-type: VARCHAR2(100)
        phone:
          type: string
          minLength: 10
          maxLength: 20
          pattern: ^[6-9][0-9]{9}$
          example: "9876543210"
          description: "Optional Indian mobile number: 10 digits starting with 6, 7, 8 or 9. Example: 9876543210.
            No country code or spaces."
          x-oracle-type: VARCHAR2(20)
        addr_1:
          type: string
          minLength: 1
          maxLength: 150
          description: Address Line 1. Required main vendor address.
          pattern: \S
          x-oracle-type: VARCHAR2(150)
        addr_2:
          type: string
          maxLength: 250
          description: Address Line 2. Optional additional address details.
          x-oracle-type: VARCHAR2(250)
        city:
          type: string
          minLength: 1
          maxLength: 80
          description: City. Required vendor city.
          pattern: \S
          x-oracle-type: VARCHAR2(80)
        state:
          type: string
          maxLength: 80
          description: State / Province. Optional region name or code.
          x-oracle-type: VARCHAR2(80)
        postal_code:
          type: string
          maxLength: 10
          pattern: ^[A-Za-z0-9]+$
          description: Postal Code. Letters and numbers only; string retains leading zeros.
          x-oracle-type: VARCHAR(10)
        country:
          type: string
          minLength: 1
          maxLength: 80
          description: Country. Required free text.
          pattern: \S
          x-oracle-type: VARCHAR2(80)
        payment_terms:
          type: string
          enum:
            - due_on_receipt
            - net_15
            - net_30
          default: net_30
          description: Payment Terms. Due on receipt, Net 15 or Net 30; defaults to net_30 on create.
          maxLength: 20
          x-oracle-type: VARCHAR2(20)
    VendorCreate:
      description: Create a vendor. Company, record ID and audit fields are assigned by the server and cannot
        be supplied.
      type: object
      additionalProperties: false
      required:
        - vendor_id
        - name
        - addr_1
        - city
        - country
      properties:
        vendor_id:
          type: string
          minLength: 1
          maxLength: 20
          pattern: ^[A-Za-z0-9-]+$
          description: Vendor ID. Unique within company and immutable after creation.
          x-oracle-type: VARCHAR2(20)
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: \S
          description: Vendor Name. Trim spaces; must not be blank.
          x-oracle-type: VARCHAR2(100)
        status:
          type: string
          enum:
            - active
            - inactive
          default: active
          description: Status. Active or Inactive; defaults to active on create. Use update to deactivate/reactivate.
          maxLength: 10
          x-oracle-type: VARCHAR2(10)
        contact:
          type: string
          maxLength: 100
          description: Contact Name. Optional primary sales or order contact.
          x-oracle-type: VARCHAR2(100)
        email:
          type: string
          format: email
          maxLength: 100
          description: Email Address. Validate format when entered; omit the field when no value is available.
          x-oracle-type: VARCHAR2(100)
        phone:
          type: string
